<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Project Expense Calculator — Shalom Group</title><link rel="stylesheet" href="project-expenses.css?v=5"></head><body><main class="app">
<header><div><a href="admin.html">← Admin</a><h1>Expense Calculator</h1><span class="muted">Projects · funding · payments</span></div></header>
<div class="selector"><label for="project-select">Select project<select id="project-select" disabled><option value="">Loading projects…</option></select></label><button id="new-project" class="primary" disabled>+ New project</button><button id="reload">Refresh</button></div>
<p id="status" role="status" aria-live="polite"></p><div id="empty" class="card empty">Choose a project or add your first one.</div>
<section id="workspace" hidden><div class="head"><h2 id="project-title"></h2><div class="actions"><button id="print-project">Print / Save PDF</button><button id="edit-project">Edit project</button></div></div><div id="metrics" class="metrics"></div><div id="warnings"></div>
<nav class="tabs" role="tablist" aria-label="Project sections"><button role="tab" data-tab="overview" aria-selected="true">Overview</button><button role="tab" data-tab="division" aria-selected="false">Cost division</button><button role="tab" data-tab="funding" aria-selected="false">Funding &amp; expenses</button><button role="tab" data-tab="bank" aria-selected="false">Bank releases</button><button role="tab" data-tab="contractors" aria-selected="false">Contractors</button><button role="tab" data-tab="expenses" aria-selected="false">Bills &amp; expenses</button></nav><div id="content"></div></section>
<footer><span>Private · saved to your admin account</span><div><button id="export" hidden>Download backup</button></div></footer>
</main><section id="project-print" aria-label="Project print report"></section><dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><h2 id="editor-title"></h2><div id="editor-fields" class="grid"></div><p id="editor-error" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel-editor">Cancel</button><button type="submit" class="primary" id="save-editor">Save</button></div></form></dialog>
<script src="project-expense-model.js?v=9"></script><script src="project-expense-print.js?v=8"></script><script src="project-expenses.js?v=15"></script></body></html>
