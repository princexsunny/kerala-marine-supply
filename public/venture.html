<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venture — Kerala Marine Supply</title>
<meta name="description" content="One of twelve connected marine ventures under the Shalom name in Trivandrum, Kerala.">
<link rel="stylesheet" href="styles-modernist.css">
<style>
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
  a{color:var(--color-accent-700);text-decoration:none}
  a:hover{color:var(--color-accent-600)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 40px}
  .brandmark{position:relative;display:inline-flex;align-items:center;flex:none;height:30px;overflow:hidden}
  .brandmark .wm{position:relative;z-index:1}
  .brandmark-wave{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:26px;width:auto;
                  max-width:none;opacity:.22;pointer-events:none;z-index:0}
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.85fr);gap:48px;align-items:center;
        padding:56px 0 48px}
  .vicon{width:34px;height:34px;color:var(--color-accent)}
  h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;letter-spacing:-0.025em;line-height:1.06;margin:14px 0 16px}
  .lead{font-size:18px;line-height:1.55;color:var(--color-neutral-800);margin:0 0 26px;max-width:52ch}
  .shot{position:relative;width:100%;aspect-ratio:4/3;background:var(--color-neutral-200);
        border:1px solid var(--color-divider);border-radius:12px;overflow:hidden}
  .shot img,.shot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .shot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
            padding:20px;color:var(--color-neutral-500);font-size:13px}
  .blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--color-divider);
          border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)}
  .block{background:var(--color-bg);padding:34px 32px}
  .block h2{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-accent-700);
            font-weight:700;margin:0 0 12px}
  .block p{font-size:15.5px;line-height:1.65;color:var(--color-neutral-800);margin:0}
  .nextnav{display:flex;justify-content:space-between;gap:20px;padding:34px 0;flex-wrap:wrap}
  .nextnav a{font-size:14px;font-weight:700}
  .allgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--color-divider)}
  .allgrid a{background:var(--color-bg);padding:16px 18px;display:flex;gap:10px;align-items:center;
             font-size:13px;font-weight:600;color:var(--color-text)}
  .allgrid a:hover{background:var(--color-neutral-200);color:var(--color-accent-700)}
  .allgrid a.on{color:var(--color-accent);}
  .allgrid .n{font-family:var(--font-heading);font-weight:800;font-size:11px;color:var(--color-neutral-500)}
  @media(max-width:860px){
    .hero{grid-template-columns:1fr;gap:28px;padding:36px 0 32px}
    .blocks{grid-template-columns:1fr}
    .allgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .wrap{padding:0 20px}
    .block{padding:26px 20px}
    /* Everything below was between 13px and 32px tall — all of it under the
       ~44px a thumb reliably hits, and all of it a link someone is meant to
       actually use. */
    .btn{min-height:46px;display:inline-flex !important;align-items:center}
    .rolelist a{min-height:40px;display:inline-flex !important;align-items:center;padding:8px 12px !important}
    .nextnav{gap:0}
    .nextnav a{min-height:46px;display:inline-flex;align-items:center;width:100%}
    .allgrid a{min-height:52px}
    header .wrap a{min-height:44px;display:inline-flex;align-items:center}
    footer a{display:inline-block;padding:8px 0}
  }
  /* The wordmark is ~330px of ink; below this it leaves no room for the two
     header links, and the page ran 133px off the side of the screen. */
  @media(max-width:620px){
    .brandmark,.brand-sep{display:none}
    header .wrap{gap:14px}
    header .wrap a[href^="index.html#"]{font-size:12.5px}
    .tb-domain{display:none}
  }
  @media(max-width:420px){
    .allgrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div style="background:var(--color-text);color:var(--color-neutral-300)">
  <div class="wrap" style="display:flex;justify-content:space-between;gap:4px 24px;font-size:11px;
       letter-spacing:0.14em;text-transform:uppercase;line-height:30px;flex-wrap:wrap;max-width:1280px">
    <span>Trivandrum · Kerala · India — Est. 2025</span>
    <span style="display:flex;gap:20px;flex-wrap:wrap">
      <a href="mailto:princexsunny@gmail.com" style="color:var(--color-neutral-300)">princexsunny@gmail.com</a>
      <span class="tb-domain" style="color:var(--color-neutral-500)">keralamarinesupply.in</span>
    </span>
  </div>
</div>

<header style="border-bottom:2px solid var(--color-divider);position:sticky;top:0;background:var(--color-bg);z-index:10">
  <div class="wrap" style="max-width:1280px;display:flex;align-items:center;gap:20px;height:50px">
    <a href="index.html" style="display:flex;align-items:center;gap:13px;flex:none;color:var(--color-text)">
      <span class="brandmark"><img class="brandmark-wave" src="wave-mark.svg" alt="" aria-hidden="true"><span class="wm" style="font-family:var(--font-heading);font-weight:800;font-size:16px;letter-spacing:-0.01em">KERALA MARINE SUPPLY</span></span>
      <span class="brand-sep" style="width:1px;height:22px;background:var(--color-divider);display:inline-block;flex:none"></span>
      <img src="shalom-group-logo.png" alt="Shalom Group" style="height:22px;width:auto;display:block;flex:none">
    </a>
    <a href="index.html#ecosystem" style="margin-left:auto;font-size:13px;font-weight:600;color:var(--color-text)">← All ventures</a>
    <a href="careers.html" style="font-size:13px;font-weight:600;color:var(--color-text)">Careers</a>
  </div>
</header>

<main class="wrap" id="main">
  <!-- filled by the script below -->
</main>

<section style="border-top:2px solid var(--color-divider);background:var(--color-neutral-200)">
  <div class="wrap" style="max-width:1280px;padding-top:34px;padding-bottom:34px">
    <div style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-accent-700);font-weight:700;margin-bottom:16px">All twelve ventures</div>
    <div class="allgrid" id="allgrid"></div>
  </div>
</section>

<footer style="border-top:2px solid var(--color-divider)">
  <div class="wrap" style="max-width:1280px;padding-top:24px;padding-bottom:24px;display:flex;
       justify-content:space-between;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--color-neutral-800)">
    <span>© 2026 Kerala Marine Supply</span>
    <span>Founded by Prince — aircraft mechanic &amp; fisherman</span>
    <span>keralamarinesupply.in · <a href="admin.html">Admin</a></span>
  </div>
</footer>

<script src="ventures-data.js"></script>
<script>
(function () {
  var ICONS = {
    cart:   '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.7 13a2 2 0 0 0 2 1.6h9a2 2 0 0 0 2-1.6L20 8H6"/>',
    gear:   '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3"/>',
    calc:   '<rect x="5" y="2.5" width="14" height="19" rx="2"/><rect x="8" y="5.5" width="8" height="3.5"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 17h.01M12 17h.01M15.5 17h.01"/>',
    crane:  '<path d="M3 16l1.6-4.5h14.8L21 16z"/><path d="M3 16q4.5 2.6 9 0t9 0"/><path d="M7 11.5V4h9M16 4l3.5 3"/>',
    fuel:   '<rect x="4" y="4" width="10" height="17" rx="1.5"/><rect x="6.5" y="6.5" width="5" height="4"/><path d="M14 10h4l2 3v6a2 2 0 0 1-4 0v-6"/><path d="M2.5 21h13"/>',
    ship:   '<path d="M3.5 16.5l1.7-5h13.6l1.7 5z"/><path d="M3.5 16.5q4.5 2.8 9 0t9 0"/><path d="M12 11.5V4l4 3z"/>',
    hook:   '<path d="M12 3v9"/><path d="M12 12c-3 0-5 1.8-5 4.2A3.8 3.8 0 0 0 15 17"/><circle cx="12" cy="3" r="1.4"/><path d="M9 6h6"/>',
    fish:   '<path d="M3 12q5-6 10.5-6T21 12q-2 6-7.5 6T3 12z"/><circle cx="16" cy="10.5" r="1" fill="currentColor" stroke="none"/><path d="M3 12L1 9M3 12l-2 3"/>',
    wrench: '<path d="M15.5 6.5a4.5 4.5 0 1 0 3.6 7.2L21 16l-3 3-2.3-2.3A4.5 4.5 0 0 0 15.5 6.5z"/><path d="M9.5 10L4 15.5 6.5 18 12 12.5"/>',
    prop:   '<circle cx="12" cy="12" r="2.4"/><path d="M12 9.6q-1.5-6 3.5-7.1 1.6 5.3-3.5 7.1zm0 4.8q1.5 6-3.5 7.1-1.6-5.3 3.5-7.1zm2.4 0q6 1.5 7.1-3.5-5.3-1.6-7.1 3.5zm-4.8 0Q3.6 15.9 2.5 10.9q5.3-1.6 7.1 3.5z"/>',
    truck:  '<rect x="2" y="7" width="12" height="10" rx="1"/><path d="M14 10h4l3.5 3.5V17H14z"/><circle cx="7" cy="19.5" r="1.6"/><circle cx="17.5" cy="19.5" r="1.6"/><path d="M6 10v4M4 12h4"/>',
    export: '<rect x="3" y="8" width="12" height="11" rx="1"/><path d="M3 12h12M8 8V5.5h5V8"/><path d="M17.5 12.5a5 5 0 1 1-3.5 8.2"/><path d="M17.5 15v3h3"/>',
  };

  var V = window.KMS_VENTURES || [];
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  var slug = new URLSearchParams(location.search).get('v') || '';
  var idx = -1;
  for (var i = 0; i < V.length; i++) if (V[i].slug === slug) idx = i;
  // Unknown or missing ?v= lands on the first venture rather than a blank page.
  if (idx === -1) idx = 0;
  var v = V[idx];
  var prev = V[(idx - 1 + V.length) % V.length];
  var next = V[(idx + 1) % V.length];

  document.title = v.name + ' — Kerala Marine Supply';
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', v.summary);

  // The vacancies come from the same list careers.html renders, so a role can
  // never be advertised in one place and missing from the other.
  var roleList = (v.roles && v.roles.length)
    ? '<ul class="rolelist" style="margin:14px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px">' +
      v.roles.map(function (r) {
        return '<li><a class="tag tag-outline" style="font-size:12px;display:inline-block" ' +
               'href="apply.html?role=' + encodeURIComponent(r) + '">' + esc(r) + ' &rarr;</a></li>';
      }).join('') + '</ul>'
    : '';

  // The built-in link is the fallback; a link saved in the admin overrides it.
  // Rendered after the fetch below, so an admin change shows without a code edit.
  function linkButton(link) {
    if (!link || !link.href) return '';
    var external = /^https?:/i.test(link.href);
    return '<a href="' + encodeURI(link.href) + '"' +
           (external ? ' target="_blank" rel="noopener"' : '') +
           ' class="btn btn-primary" style="font-size:14px">' +
           esc(link.label || 'Visit website') + (external ? ' ↗' : ' →') + '</a>';
  }
  var linkBtn = linkButton(v.link);

  document.getElementById('main').innerHTML =
    '<div class="hero">' +
      '<div>' +
        '<div style="display:flex;align-items:center;gap:12px">' +
          '<svg class="vicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
          'stroke-linecap="round" stroke-linejoin="round">' + ICONS[v.icon] + '</svg>' +
          '<span style="font-family:var(--font-heading);font-weight:800;font-size:13px;color:var(--color-neutral-500)">' + esc(v.num) + '</span>' +
          '<span class="tag tag-accent" style="font-size:11px">' + esc(v.status) + '</span>' +
        '</div>' +
        '<h1>' + esc(v.name) + '</h1>' +
        '<p class="lead">' + esc(v.summary) + '</p>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap">' + linkBtn +
          '<a href="careers.html" class="btn btn-secondary" style="font-size:14px">Jobs at Shalom</a>' +
          '<a href="tel:+919400912894" class="btn btn-ghost" style="font-size:14px">Call +91 94009 12894</a>' +
        '</div>' +
      '</div>' +
      '<div class="shot" id="shot"><div class="ph">Photograph — ' + esc(v.name) + '</div></div>' +
    '</div>' +

    '<div class="blocks">' +
      '<div class="block"><h2>What it is</h2><p>' + esc(v.brief) + '</p></div>' +
      '<div class="block"><h2>The opportunity</h2><p>' + esc(v.opportunity) + '</p></div>' +
      '<div class="block"><h2>How it earns</h2><p>' + esc(v.model) + '</p></div>' +
      '<div class="block"><h2>Jobs it creates</h2><p>' + esc(v.jobs) + '</p>' + roleList + '</div>' +
      '<div class="block" style="grid-column:1/-1"><h2>What it unlocks next</h2><p>' + esc(v.next) + '</p></div>' +
    '</div>' +

    '<div class="nextnav">' +
      '<a href="venture.html?v=' + prev.slug + '">← ' + esc(prev.num + ' ' + prev.name) + '</a>' +
      '<a href="venture.html?v=' + next.slug + '">' + esc(next.num + ' ' + next.name) + ' →</a>' +
    '</div>';

  // All-ventures rail
  document.getElementById('allgrid').innerHTML = V.map(function (x) {
    return '<a href="venture.html?v=' + x.slug + '"' + (x.slug === v.slug ? ' class="on"' : '') + '>' +
           '<span class="n">' + esc(x.num) + '</span><span>' + esc(x.name) + '</span></a>';
  }).join('');

  // Website set in /admin.html, if any — replaces the built-in one.
  fetch('/api/venture-links', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (m) {
      var saved = m && m[v.slug];
      if (!saved || !saved.href) return;
      var holder = document.querySelector('.hero .btn.btn-primary');
      var html = linkButton(saved);
      if (holder) holder.outerHTML = html;
      else {
        var row = document.querySelector('.hero div[style*="display:flex"]');
        if (row) row.insertAdjacentHTML('afterbegin', html);
      }
    })
    .catch(function () { /* keep the built-in link */ });

  // Venture photograph, uploaded in /admin.html. Empty slot keeps the caption.
  fetch('/api/media', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (m) {
      var entry = m && m[v.photo];
      if (!entry || !entry.url) return;
      var shot = document.getElementById('shot');
      var isVideo = entry.contentType && entry.contentType.indexOf('video/') === 0;
      var el;
      if (isVideo) {
        el = document.createElement('video');
        el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true;
        el.setAttribute('playsinline', '');
      } else {
        el = document.createElement('img');
        el.alt = v.name;
      }
      el.src = entry.url;
      shot.innerHTML = '';
      shot.appendChild(el);
    })
    .catch(function () { /* no photo — the caption stays */ });
})();
</script>
</body>
</html>
